name: Postgres Integration Tests

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/integration_coworker/persistence/**'
      - 'src/integration_coworker/retrieval/**'
      - 'scripts/init_db*.py'
      - 'scripts/init-pgvector.sql'
      - 'tests/test_pgvector*.py'
      - 'tests/test_m4_persistence.py'
      - '.github/workflows/test-postgres.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/integration_coworker/persistence/**'
      - 'src/integration_coworker/retrieval/**'
      - 'scripts/init_db*.py'
      - 'scripts/init-pgvector.sql'
      - 'tests/test_pgvector*.py'
      - 'tests/test_m4_persistence.py'
      - '.github/workflows/test-postgres.yml'
  workflow_dispatch:

jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_coworker
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d test_coworker"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_coworker
      USE_MOCK_LLM: "true"
      
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install psycopg2-binary pgvector

    - name: Wait for Postgres to be ready
      run: |
        for i in {1..30}; do
          pg_isready -h localhost -p 5432 -U test_user && break
          echo "Waiting for postgres... ($i)"
          sleep 1
        done

    - name: Initialize database schema
      run: |
        python scripts/init_db_postgres.py
        psql $DATABASE_URL -f scripts/init-pgvector.sql

    - name: Run persistence tests
      run: |
        pytest tests/test_m4_persistence.py -v --tb=short

    - name: Run pgvector tests
      run: |
        pytest tests/test_pgvector_search.py -v --tb=short

    - name: Run Postgres integration tests
      run: |
        pytest tests/test_postgres_integration.py -v --tb=short
