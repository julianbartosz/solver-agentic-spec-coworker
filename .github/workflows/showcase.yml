name: Showcase Demo

on:
  push:
    branches: [ main, master ]
    paths:
      - 'scripts/demo-final-showcase.sh'
      - 'docker-compose.yml'
      - 'src/integration_coworker/**'
      - '.github/workflows/showcase.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'scripts/demo-final-showcase.sh'
      - 'docker-compose.yml'
      - 'src/integration_coworker/**'
      - '.github/workflows/showcase.yml'
  workflow_dispatch:

# ============================================================================
# SHOWCASE CI - Validates production demo harness against Docker Compose
# ============================================================================
# This workflow:
#   1. Starts db + redis via docker-compose
#   2. Waits for healthchecks (pg_isready)
#   3. Runs showcase script with --quick flag
#
# Required for: Ensuring demo reproducibility in CI environments
# ============================================================================

jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      USE_MOCK_LLM: "true"
      USE_SQLITE: "false"
      VALIDATION_PROFILE: "offline"
      # Use default port from docker-compose.yml
      DATABASE_URL: postgresql://solver:solver@localhost:15432/solver_coworker

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        pip install psycopg2-binary pgvector

    - name: Verify Docker is available
      run: |
        docker --version
        docker compose version

    - name: Start Docker Compose services
      run: |
        docker compose up -d db redis
        echo "Waiting for services to be healthy..."

    - name: Wait for Postgres healthcheck
      run: |
        # Get container ID dynamically (robust to project name changes)
        db_cid=$(docker compose ps -q db)
        if [ -z "$db_cid" ]; then
          echo "❌ db container not found"
          docker compose ps
          exit 1
        fi
        echo "Found db container: $db_cid"
        
        # Wait up to 60s for Postgres to report healthy
        timeout=60
        elapsed=0
        while [ $elapsed -lt $timeout ]; do
          status=$(docker inspect --format='{{.State.Health.Status}}' "$db_cid" 2>/dev/null || echo "not-found")
          echo "Postgres health status: $status (${elapsed}s elapsed)"
          if [ "$status" = "healthy" ]; then
            echo "✅ Postgres is healthy"
            break
          elif [ "$status" = "unhealthy" ]; then
            echo "❌ Postgres is unhealthy"
            docker logs "$db_cid"
            exit 1
          fi
          sleep 2
          elapsed=$((elapsed + 2))
        done
        
        if [ $elapsed -ge $timeout ]; then
          echo "❌ Timeout waiting for Postgres"
          docker logs "$db_cid"
          exit 1
        fi

    - name: Initialize database schema
      run: |
        python scripts/init_db_postgres.py
        PGPASSWORD=solver psql -h localhost -p 15432 -U solver -d solver_coworker -f scripts/init-pgvector.sql

    - name: Run showcase script (quick mode)
      run: |
        bash scripts/demo-final-showcase.sh --quick --no-per-spec-validation

    - name: Show Docker logs on failure
      if: failure()
      run: |
        echo "=== Postgres logs ==="
        docker compose logs db || true
        echo "=== Redis logs ==="
        docker compose logs redis || true

    - name: Cleanup Docker Compose
      if: always()
      run: |
        docker compose down -v
