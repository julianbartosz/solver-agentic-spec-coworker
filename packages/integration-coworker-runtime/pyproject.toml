[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "integration-coworker-runtime"
version = "0.1.0"
description = "Lightweight runtime library for Integration Coworker generated API clients"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Julian Bartosz", email = "julian@example.com"},
]
keywords = [
    "api",
    "client",
    "integration",
    "runtime",
    "http",
    "retry",
    "rate-limiting",
    "authentication",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]

dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",  # For mocking httpx
]

[project.urls]
Homepage = "https://github.com/julianbartosz/solver-agentic-spec-coworker"
Documentation = "https://github.com/julianbartosz/solver-agentic-spec-coworker#readme"
Repository = "https://github.com/julianbartosz/solver-agentic-spec-coworker"
Issues = "https://github.com/julianbartosz/solver-agentic-spec-coworker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/integration_coworker_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
