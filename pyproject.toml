[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solver-agentic-spec-coworker"
version = "0.1.0"
description = "Agentic co-worker to auto-discover data/API requirements from source specs"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Julian Bartosz"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "langchain>=0.1.0",
    "langgraph>=0.0.20",
    "langchain-core>=0.1.0",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
postgres = [
    "psycopg[binary]>=3.1.0",
    "psycopg_pool>=3.1.0",
]
ui = [
    "streamlit>=1.28.0",
]
all = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "psycopg[binary]>=3.1.0",
    "psycopg_pool>=3.1.0",
    "streamlit>=1.28.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["integration_coworker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
norecursedirs = ["tests/fixtures/repos"]
markers = [
    "no_db: mark test as not requiring database setup/teardown",
    "perf_smoke: performance smoke tests with timing assertions"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []
