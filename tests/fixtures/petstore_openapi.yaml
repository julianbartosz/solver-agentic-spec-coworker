openapi: 3.0.0
info:
  title: Petstore API
  version: 1.0.0
  description: Minimal Petstore API for testing dynamic spec handling

servers:
  - url: https://petstore.swagger.io/v2
    description: Swagger Petstore

security:
  - apiKey: []

paths:
  /pets:
    get:
      operationId: listPets
      summary: List all pets
      tags:
        - pets
      parameters:
        - name: limit
          in: query
          description: How many items to return
          required: false
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    
    post:
      operationId: createPet
      summary: Create a new pet
      tags:
        - pets
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePetRequest'
      responses:
        '201':
          description: Pet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Invalid input

  /pets/{petId}:
    get:
      operationId: getPetById
      summary: Get a pet by ID
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
          description: Pet ID
      responses:
        '200':
          description: Pet details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found
    
    delete:
      operationId: deletePet
      summary: Delete a pet
      tags:
        - pets
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Pet deleted
        '404':
          description: Pet not found

components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: api_key
      description: API key for authentication

  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: Fluffy
        status:
          type: string
          enum: [available, pending, sold]
          example: available
        category:
          type: string
          example: dog

    CreatePetRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: Fluffy
        status:
          type: string
          enum: [available, pending, sold]
        category:
          type: string
