# LLM and Embedding Configuration
# Per Appendix E.2 of the design specification

llm:
  planning:
    model: gpt-4.1
    temperature: 0.2
    max_tokens: 2048
    num_samples: 2
    max_parallel_samples: 2

  extraction:
    model: gpt-4o-mini
    temperature: 0.0
    max_tokens: 1024

  codegen:
    model: gpt-4.1
    temperature: 0.15
    max_tokens: 4096
    num_candidates: 2
    max_parallel_modules: 3

embeddings:
  model: text-embedding-3-small
  dimensions: 1536
  max_parallel_embeddings: 4
